version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: sentinelle-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelle_db}
      POSTGRES_USER: ${POSTGRES_USER:-sentinelle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelle -d sentinelle_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: mohamedbouzidcloud/sentinelle-backend:latest
    pull_policy: always
    container_name: sentinelle-backend
    env_file:
      - .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-sentinelle}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sentinelle}
      DB_NAME: ${POSTGRES_DB:-sentinelle_db}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    ports:
      - "8000:8000"

  frontend:
    image: mohamedbouzidcloud/sentinelle-frontend:latest
    pull_policy: always
    container_name: sentinelle-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data: