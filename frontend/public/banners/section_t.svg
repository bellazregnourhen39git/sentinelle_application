<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Scanning Glow -->
  <circle cx="400" cy="220" r="180" fill="url(#glowGrad)" />

  <!-- Cybernetic Reticles -->
  <circle cx="400" cy="220" r="140" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="5 5" />
  <circle cx="400" cy="220" r="100" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.15" />
  
  <!-- Outer Brackets -->
  <path d="M 230,150 L 230,120 L 260,120" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3" />
  <path d="M 570,150 L 570,120 L 540,120" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3" />
  <path d="M 230,290 L 230,320 L 260,320" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3" />
  <path d="M 570,290 L 570,320 L 540,320" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3" />

  <!-- Center Core Icon -->
  <g id="coreIcon">
    <rect x="350" y="185" width="45" height="60" rx="4" transform="rotate(-15 372.5 215)" fill="none" stroke="#f59e0b" stroke-width="5"/><rect x="405" y="185" width="45" height="60" rx="4" transform="rotate(15 427.5 215)" fill="none" stroke="#f59e0b" stroke-width="5"/><circle cx="365" cy="205" r="4" fill="#f59e0b"/><circle cx="435" cy="205" r="4" fill="#f59e0b"/>
  </g>

  <!-- Text Annotations -->
  <text x="400" y="380" font-family="'Outfit', 'Inter', 'Roboto', sans-serif" font-size="28" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4" font-style="italic">JEUX DE HASARD / ARGENT</text>
  <text x="400" y="410" font-family="'Outfit', 'Inter', 'Roboto', sans-serif" font-size="11" font-weight="900" fill="#f59e0b" text-anchor="middle" letter-spacing="8" opacity="0.8">SECTION T</text>

  <!-- Scanning Line -->
  <line x1="200" y1="60" x2="600" y2="60" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.05" />
</svg>
